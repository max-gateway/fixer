name: Build and push images

# Every tenant runs the same image — this workflow builds it once per
# release and pushes both the API and Web images with a matching tag,
# which Terraform/Helm then reference per tenant (image.tag in values.yaml).

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write # for OIDC auth to AWS, no long-lived keys stored in GitHub
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            repository: fixer
            dockerfile: apps/api/Dockerfile
          - app: web
            repository: fixer-web
            dockerfile: apps/web/Dockerfile
          - app: notifications
            repository: fixer-notifications
            dockerfile: apps/notifications/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Tag is deterministic from the commit SHA, so any downstream consumer
      # (e.g. the control plane triggering a tenant deploy) can recompute it
      # without reading this job's output.
      - name: Resolve image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.repository }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.repository }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
