name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # @max-gateway/auth vem do registro de pacotes da organização

jobs:
  node:
    name: Lint, typecheck e testes (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx turbo run build lint typecheck test

  compose:
    name: Valida docker-compose de dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/dev/docker-compose.yml --profile vision config -q
        env:
          MAX_GATEWAY_PLATFORM_DIR: /tmp/max-gateway-platform
