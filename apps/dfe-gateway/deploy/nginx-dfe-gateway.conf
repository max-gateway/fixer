# Acrescentar ao nginx/rocket.conf do rocket (mesmo padrão dos outros hosts). Pré-requisitos:
#   1. DNS: dfe.maxgateway.com.br -> IP público da VM.
#   2. Certificado: certbot certonly --webroot -w /var/www/certbot -d dfe.maxgateway.com.br
#   3. O nginx precisa estar na rede do gateway (rocket_prod_network já está; o gateway entra nela).
#
# Só /v1 e /healthz são publicados. /metrics, /readyz e qualquer outra rota respondem 404 pelo nginx:
# métricas são lidas por dentro da rede (Prometheus/agente na VM).

# Anti-abuso (uma chave de API vale muito): 20 req/s por IP, rajada 40. (contexto http)
limit_req_zone $binary_remote_addr zone=dfe:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name dfe.maxgateway.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dfe.maxgateway.com.br;

    ssl_certificate     /etc/letsencrypt/live/dfe.maxgateway.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dfe.maxgateway.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # O .pfx vai em base64 no JSON (~350 KB). A API também limita a 1 MB; aqui barra antes de chegar nela.
    client_max_body_size 1m;

    location = /healthz {
        proxy_pass http://dfe-api:3010/healthz;
    }

    location /v1/ {
        limit_req zone=dfe burst=40 nodelay;
        proxy_pass http://dfe-api:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A API confia no 1º salto (trust proxy = 1): o IP gravado na auditoria é o do cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        # Nunca guardar respostas com XML/certificado em cache de proxy.
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
