# Ambiente de desenvolvimento local do Fixer: toda a infra num lugar só.
#   npm run infra:up        sobe tudo e espera os healthchecks
#   npm run infra:down      para (dados ficam nos volumes nomeados)
#   npm run infra:logs      segue os logs
# plate-lookup, cnpj-lookup, plate-reader e cost-engine são serviços da plataforma Max Gateway (repo max-gateway/platform):
# o compose os constrói a partir de MAX_GATEWAY_PLATFORM_DIR (.env da raiz).
# Com a câmera/leitor de placa: npm run infra:up -- --profile vision
#
# Portas: postgres 5432 · redis 6379 · cost-engine 3030 · plate-reader 8080 · plate-lookup 8081 · cnpj-lookup 8082 · keycloak 8180
# Keycloak: admin/admin em http://localhost:8180, realm "fixer-dev", usuário dev@fixer.local / dev123.
# O id do usuário de teste em realm-fixer-dev.json é fixo de propósito: a API liga User.keycloakId ao sub
# do token, então reimportar o realm com id novo faria o login falhar (e-mail duplicado).
name: fixer

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fixer_app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fixer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixer_app -d fixer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    # DEV_HOST (raiz/.env) é usado como ${DEV_HOST:localhost} no realm-fixer-dev.json.
    env_file:
      - path: ../../.env
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./realm-fixer-dev.json:/opt/keycloak/data/import/realm-fixer-dev.json:ro
      - ../keycloak-theme/fixer:/opt/keycloak/themes/fixer:ro
    healthcheck:
      # A imagem não tem curl; testa a porta de management (9000) com bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # Consulta de placa na Puxa Placa (paga). O token vem de <platform>/services/plate-lookup/.env (nunca comitado);
  # sem token o serviço se recusa a subir.
  plate-lookup:
    <<: *restart
    build: ${MAX_GATEWAY_PLATFORM_DIR:?defina MAX_GATEWAY_PLATFORM_DIR no .env da raiz (caminho do repo max-gateway/platform)}/services/plate-lookup
    env_file:
      - path: ${MAX_GATEWAY_PLATFORM_DIR}/services/plate-lookup/.env
        required: false
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8081/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Consulta de CNPJ + Inscrições Estaduais no CNPJá (paga). A chave vem de <platform>/services/cnpj-lookup/.env
  # (nunca comitado); sem chave o serviço se recusa a subir.
  cnpj-lookup:
    <<: *restart
    build: ${MAX_GATEWAY_PLATFORM_DIR:?defina MAX_GATEWAY_PLATFORM_DIR no .env da raiz (caminho do repo max-gateway/platform)}/services/cnpj-lookup
    env_file:
      - path: ${MAX_GATEWAY_PLATFORM_DIR}/services/cnpj-lookup/.env
        required: false
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8082/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Motor de custos (despesas, perfil de custos, composição de preço). Usa o banco "cost_engine" deste postgres,
  # criado uma vez (o volume não roda init scripts):
  #   docker exec fixer-postgres-1 psql -U fixer_app -d fixer -c "CREATE ROLE cost_engine LOGIN PASSWORD 'password'" -c "CREATE DATABASE cost_engine OWNER cost_engine"
  # Chave para a API (vai em COST_ENGINE_API_KEY no apps/api/.env; é impressa uma única vez):
  #   docker exec fixer-cost-engine-1 node dist/cli.js create-key fixer:local "Fixer dev"
  cost-engine:
    <<: *restart
    build: ${MAX_GATEWAY_PLATFORM_DIR:?defina MAX_GATEWAY_PLATFORM_DIR no .env da raiz (caminho do repo max-gateway/platform)}/services/cost-engine
    environment:
      CE_DATABASE_URL: postgresql://cost_engine:password@postgres:5432/cost_engine
    ports:
      - "3030:3030"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3030/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Leitor de placa por imagem/câmera. Pesado: só sobe com --profile vision.
  plate-reader:
    <<: *restart
    profiles: ["vision"]
    build: ${MAX_GATEWAY_PLATFORM_DIR:?defina MAX_GATEWAY_PLATFORM_DIR no .env da raiz (caminho do repo max-gateway/platform)}/services/plate-reader
    environment:
      PLATE_READER_REDIS_URL: redis://redis:6379/0
      PLATE_READER_OCR_ENGINE: opencv_tesseract
      PLATE_READER_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  redisdata:
