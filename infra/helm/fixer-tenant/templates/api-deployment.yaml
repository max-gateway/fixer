apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fixer-tenant.fullname" . }}-api
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      fixer.io/tenant: {{ .Values.tenant.slug }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "fixer-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "fixer-tenant.fullname" . }}-branding
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseUrlSecretName }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redisUrlSecretName }}
                  key: REDIS_URL
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.keycloakSecretName }}
                  key: CLIENT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fixer-tenant.fullname" . }}-api
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    fixer.io/tenant: {{ .Values.tenant.slug }}
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
