apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fixer-tenant.fullname" . }}-api
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      fixer.io/tenant: {{ .Values.tenant.slug }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "fixer-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "fixer-tenant.fullname" . }}-branding
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseUrlSecretName }}
                  key: DATABASE_URL
            - name: PORTAL_BASE_URL
              value: "https://{{ .Values.ingress.webHost }}"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redisUrlSecretName }}
                  key: REDIS_URL
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.keycloakSecretName }}
                  key: CLIENT_SECRET
            {{- if .Values.secrets.fiscalSecretName }}
            - name: FISCAL_ENC_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.fiscalSecretName }}
                  key: FISCAL_ENC_KEYS
            - name: FISCAL_ACTIVE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.fiscalSecretName }}
                  key: FISCAL_ACTIVE_KEY_ID
            {{- end }}
            {{- if .Values.secrets.dfeGatewaySecretName }}
            # Modo gateway: a SEFAZ é consultada pelo dfe-gateway central; este tenant só consome.
            # FISCAL_ENC_KEYS e as URLs da SEFAZ deixam de ser necessárias.
            - name: DFE_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dfeGatewaySecretName }}
                  key: DFE_GATEWAY_URL
            - name: DFE_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dfeGatewaySecretName }}
                  key: DFE_GATEWAY_API_KEY
            {{- end }}
            {{- if .Values.fiscal.distUrlProduction }}
            - name: FISCAL_DIST_URL_PRODUCTION
              value: {{ .Values.fiscal.distUrlProduction | quote }}
            {{- end }}
            {{- if .Values.fiscal.distUrlHomologation }}
            - name: FISCAL_DIST_URL_HOMOLOGATION
              value: {{ .Values.fiscal.distUrlHomologation | quote }}
            {{- end }}
            {{- if .Values.fiscal.eventUrlProduction }}
            - name: FISCAL_EVENT_URL_PRODUCTION
              value: {{ .Values.fiscal.eventUrlProduction | quote }}
            {{- end }}
            {{- if .Values.fiscal.eventUrlHomologation }}
            - name: FISCAL_EVENT_URL_HOMOLOGATION
              value: {{ .Values.fiscal.eventUrlHomologation | quote }}
            {{- end }}
            {{- if .Values.fiscal.eventSoap }}
            - name: FISCAL_EVENT_SOAP
              value: {{ .Values.fiscal.eventSoap | quote }}
            {{- end }}
            {{- if .Values.fiscal.caBundleConfigMap }}
            - name: FISCAL_CA_BUNDLE
              value: /etc/fiscal-ca/ca.pem
            {{- end }}
          {{- if .Values.fiscal.caBundleConfigMap }}
          volumeMounts:
            - name: fiscal-ca
              mountPath: /etc/fiscal-ca
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if .Values.fiscal.caBundleConfigMap }}
      volumes:
        - name: fiscal-ca
          configMap:
            name: {{ .Values.fiscal.caBundleConfigMap }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fixer-tenant.fullname" . }}-api
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    fixer.io/tenant: {{ .Values.tenant.slug }}
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
