apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fixer-tenant.fullname" . }}-branding
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
data:
  TENANT_SLUG: {{ .Values.tenant.slug | quote }}
  TENANT_DISPLAY_NAME: {{ .Values.tenant.displayName | quote }}
  BRAND_LOGO_URL: {{ .Values.branding.logoUrl | quote }}
  BRAND_PRIMARY_COLOR: {{ .Values.branding.primaryColor | quote }}
  BRAND_SECONDARY_COLOR: {{ .Values.branding.secondaryColor | quote }}
  KEYCLOAK_REALM: {{ .Values.keycloak.realm | quote }}
  KEYCLOAK_AUTH_SERVER_URL: {{ .Values.keycloak.authServerUrl | quote }}
  AUTH_AUDIENCE: {{ .Values.keycloak.audience | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
  KEYCLOAK_WEB_CLIENT_ID: {{ .Values.keycloak.webClientId | quote }}
