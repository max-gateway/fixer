apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fixer-tenant.fullname" . }}-branding
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
data:
  TENANT_SLUG: {{ .Values.tenant.slug | quote }}
  TENANT_DISPLAY_NAME: {{ .Values.tenant.displayName | quote }}
  BRAND_LOGO_URL: {{ .Values.branding.logoUrl | quote }}
  BRAND_PRIMARY_COLOR: {{ .Values.branding.primaryColor | quote }}
  BRAND_SECONDARY_COLOR: {{ .Values.branding.secondaryColor | quote }}
  KEYCLOAK_REALM: {{ .Values.keycloak.realm | quote }}
  KEYCLOAK_AUTH_SERVER_URL: {{ .Values.keycloak.authServerUrl | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
  # Audiência (aud) que a API exige no token; o client web precisa de um audience mapper para ela.
  AUTH_AUDIENCE: {{ .Values.keycloak.audience | default .Values.keycloak.clientId | quote }}
  # Borda da plataforma de catálogo (parts-search). A API não sobe sem ela.
  PARTS_SEARCH_URL: {{ required "catalogPlatform.url é obrigatório (URL da borda do parts-search)" .Values.catalogPlatform.url | quote }}
  PARTS_SEARCH_TIMEOUT_MS: {{ .Values.catalogPlatform.timeoutMs | default 2000 | quote }}
  # Catálogos globais da plataforma (parts-search) que a oficina lê, separados por vírgula.
  PARTS_SEARCH_CATALOGS: {{ .Values.catalogPlatform.catalogs | quote }}
  KEYCLOAK_WEB_CLIENT_ID: {{ .Values.keycloak.webClientId | quote }}
