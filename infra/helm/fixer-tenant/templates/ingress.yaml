apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fixer-tenant.fullname" . }}
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.webHost }}
        - {{ .Values.ingress.apiHost }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.webHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fixer-tenant.fullname" . }}-web
                port:
                  number: 80
    - host: {{ .Values.ingress.apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fixer-tenant.fullname" . }}-api
                port:
                  number: 80
