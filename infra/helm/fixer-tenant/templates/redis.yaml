# In-cluster Redis, one instance per tenant namespace.
# Cache/session/queue data only — never the system of record, so a single
# replica with a small PVC is enough; losing it costs a cache warm-up, not data.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.tenant.slug }}-redis
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ .Values.tenant.slug }}-redis
  replicas: 1
  selector:
    matchLabels:
      fixer.io/tenant: {{ .Values.tenant.slug }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "fixer-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "redis:7.2-alpine"
          command:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.tenant.slug }}-redis
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None # headless: stable DNS name for the StatefulSet pod, matches REDIS_URL from Terraform
  selector:
    fixer.io/tenant: {{ .Values.tenant.slug }}
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
