apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fixer-tenant.fullname" . }}-web
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      fixer.io/tenant: {{ .Values.tenant.slug }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "fixer-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}-web:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          envFrom:
            - configMapRef:
                name: {{ include "fixer-tenant.fullname" . }}-branding
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://{{ .Values.ingress.apiHost }}"
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fixer-tenant.fullname" . }}-web
  labels:
    {{- include "fixer-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    fixer.io/tenant: {{ .Values.tenant.slug }}
    app.kubernetes.io/component: web
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
