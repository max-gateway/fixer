# Everything below is what changes from one workshop (tenant) to the next.
# The image is always the same across all tenants — only these values differ.

tenant:
  # Slug used to name resources and build the default hostname (e.g. "oficina-silva").
  slug: ""
  displayName: ""

branding:
  logoUrl: ""
  primaryColor: "#1F6BFF"
  secondaryColor: "#080D17"

image:
  repository: ""      # e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/fixer
  tag: ""              # immutable tag or digest, set by CI on release
  pullPolicy: IfNotPresent

api:
  replicaCount: 2
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicaCount: 2
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

# Serviço de notificações: consome o stream de eventos de ordens (Redis do tenant)
# e entrega e-mails/webhooks. Imagem: por padrão "<image.repository>-notifications" (legado). Para usar a da plataforma
# Max Gateway (recomendado em AWS: ECR, sem segredo no cluster; o papel dos nós já lê o ECR), defina repository e tag:
#   notifications.image.repository: <conta>.dkr.ecr.<região>.amazonaws.com/max-gateway/notifications
#   notifications.image.tag: "0.1.1"
notifications:
  enabled: true
  image:
    repository: ""
    tag: ""
  replicaCount: 2
  port: 3002
  email:
    transport: log          # "smtp" em produção (exige secrets.notificationsSecretName com SMTP_URL)
    from: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

redis:
  storageSize: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  # Full hostnames for this tenant. Left empty by default; the provisioning
  # pipeline fills these in from tenant.slug plus the platform's base domain.
  apiHost: ""
  webHost: ""
  className: nginx
  tlsSecretName: ""     # created by cert-manager per tenant

# Populated by the provisioning pipeline (Terraform output), never committed to git.
# The chart only references secret/key names — it never carries credential values.
secrets:
  databaseUrlSecretName: ""   # Secret holding DATABASE_URL, created by Terraform/External Secrets
  redisUrlSecretName: ""      # Secret holding REDIS_URL
  notificationsSecretName: "" # Secret com SMTP_URL e WEBHOOKS (opcionais; só se usados)
  keycloakSecretName: ""      # Secret holding this tenant's Keycloak realm client secret
  dfeGatewaySecretName: ""   # Secret com DFE_GATEWAY_URL e DFE_GATEWAY_API_KEY (docs/specs/dfe-gateway.md). Preenchido = modo gateway: o certificado vive no gateway
  fiscalSecretName: ""        # Secret com FISCAL_ENC_KEYS e FISCAL_ACTIVE_KEY_ID (cifra do certificado A1). Vazio = importação de NF-e indisponível

# Importação de NF-e (docs/specs/nfe-import.md). Os endereços vêm da "Relação de Serviços Web" do Portal
# Nacional da NF-e (produção) e do portal de homologação; não há default no código de propósito.
fiscal:
  distUrlProduction: ""
  distUrlHomologation: ""
  eventUrlProduction: ""      # NFeRecepcaoEvento (manifestação do destinatário)
  eventUrlHomologation: ""
  eventSoap: "1.2"            # "1.1" se o WSDL do ambiente pedir
  # ConfigMap com a chave `ca.pem`: cadeia ICP-Brasil dos servidores da SEFAZ. O repositório de CAs do
  # Node não a inclui, e a verificação do servidor nunca é desligada.
  caBundleConfigMap: ""

keycloak:
  realm: ""
  authServerUrl: ""
  clientId: "fixer-api"
  webClientId: "fixer-web"
  # Audiência exigida no token (padrão: o clientId da API).
  audience: ""

catalogPlatform:
  # Catálogos globais da plataforma (parts-search) que a oficina lê, separados por vírgula.
  catalogs: "rocket-autopecas"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
